name: Auto Update Daily Briefing Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.html'
      - 'audio/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate issues.json from dated HTML files
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          from datetime import datetime, timezone, timedelta

          pattern = re.compile(r'^(\d{4})[-_](\d{2})[-_](\d{2})\.html$', re.IGNORECASE)
          by_date = {}

          for fname in os.listdir('.'):
              if fname.lower() == 'index.html':
                  continue
              m = pattern.match(fname)
              if m:
                  date_str = f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
                  if date_str not in by_date or '-' in fname:
                      by_date[date_str] = fname

          issues = [{"date": d, "file": by_date[d]} for d in sorted(by_date.keys())]
          tz_bj = timezone(timedelta(hours=8))
          payload = {
              "updated_at": datetime.now(tz_bj).isoformat(timespec="seconds"),
              "latest": issues[-1]["date"] if issues else "",
              "issues": issues
          }

          with open("issues.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Indexed {len(issues)} issue(s). Latest: {payload['latest']}")
          EOF

      - name: Commit and push updated issues.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet issues.json && [ -z "$(git ls-files --others --exclude-standard issues.json)" ]; then
            echo "No changes to issues.json"
            exit 0
          fi
          git add issues.json
          git commit -m "chore: auto-update issues.json [skip ci]"
          git push
